name: Build Front Launcher Artifacts

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package All Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Native Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure Persistent Keystore Exists
        run: |
          rm -f ci-debug.keystore
          keytool -genkey -v -keystore ci-debug.keystore -storetype JKS -storepass androiddebug -alias androiddebugkey -keypass androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FrontLauncher,O=CI,C=US"

      - name: Generate google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"front-launcher-ci","storage_bucket":"front.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"mock_api_key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Compile Debug APK
        run: ./gradlew assembleDebug -x test -x lint -x lintAnalyzeDebug --stacktrace --no-daemon

      - name: Compile Release APK
        run: ./gradlew assembleRelease -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --stacktrace --no-daemon

      - name: Compile App Bundle (AAB)
        run: ./gradlew bundleRelease -x test -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --stacktrace --no-daemon

      - name: Package Android Studio Source
        run: |
          zip -r front-launcher-project.zip . -x ".git/*" ".gradle/*" "*/build/*" ".idea/*" "*.apk" "*.aab"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-AAB
          path: app/build/outputs/bundle/*/*.aab
          retention-days: 14

      - name: Upload Studio Project
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Studio-Source
          path: front-launcher-project.zip
          retention-days: 14

      - name: Commit Debug APK to Repository Root
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/*.apk ./FrontLauncher-debug.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add FrontLauncher-debug.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): update FrontLauncher-debug.apk at root" && git push origin main)

