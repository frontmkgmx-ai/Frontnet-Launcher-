name: Build Front Launcher Artifacts

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Fixed Debug Keystore
        run: |
          mkdir -p app
          if [ ! -f app/ci-debug.keystore ]; then
            keytool -genkey -v -keystore app/ci-debug.keystore -storepass androiddebug -alias androiddebugkey -keypass androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK & Bundles
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Package Android Studio Project
        run: |
          zip -r front-launcher-project.zip . -x ".git/*" ".gradle/*" "*/build/*" ".idea/*"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Release-Unsigned-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Bundles AAB
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-Bundle-AAB
          path: app/build/outputs/bundle/*/*.aab

      - name: Upload Android Studio Project
        uses: actions/upload-artifact@v4
        with:
          name: FrontLauncher-AndroidStudio-Project
          path: front-launcher-project.zip
