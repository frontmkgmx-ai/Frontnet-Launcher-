# Project-wide Gradle settings.

# Kotlin code style for this project
kotlin.code.style=official

# Non-transitive R classes and AndroidX
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=true

# Memory Optimization & CI Hardening
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.vfs.watch=false

# Workers limit
org.gradle.workers.max=4

# Kotlin compiler execution strategy
kotlin.compiler.execution.strategy=in-process

# Allow google-services plugin to work without json
googleServices.missing.passthrough=true

# KSP properties
ksp.incremental=false
ksp.useKSP2=true

# Disallow Kotlin source sets warning fix
android.disallowKotlinSourceSets=false
